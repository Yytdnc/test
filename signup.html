  <title>회원가입 | MindPick</title>

  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet" />

<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-WZW58QPM"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->
  <header class="topbar">
    <a class="brand" href="index.html"><span class="logo-emoji">🧠</span>Mind<span class="accent">Pick</span></a>
    <nav>
      <a href="index.html">홈</a>
      <a href="community.html">커뮤니티</a>
      <a href="privacy.html">개인정보처리방침</a>
    </nav>
  </header>

  <main class="auth-shell">
    <div id="config-warning" class="status-msg err" style="display:none;">
      아직 관리자가 커뮤니티 연결을 완료하지 않았어요. 잠시 후 다시 확인해주세요.
    </div>

    <div id="auth-card" class="auth-card">
      <div class="auth-card-head">
        <span class="auth-emoji">✨</span>
        <h1>회원가입</h1>
        <p>MindPick 커뮤니티에 오신 걸 환영해요</p>
      </div>

      <div class="field"><label>닉네임</label><input type="text" id="signup-nickname" maxlength="20" /></div>
      <div class="field"><label>이메일</label><input type="email" id="signup-email" autocomplete="username" /></div>
      <div class="field"><label>비밀번호 (6자 이상)</label><input type="password" id="signup-password" autocomplete="new-password" /></div>
      <button type="button" id="signup-submit-btn" class="button primary block">회원가입</button>

      <div id="signup-status" class="status-msg"></div>

      <p class="auth-switch">이미 계정이 있으신가요? <a href="login.html">로그인</a></p>
    </div>
  </main>

  <footer>
    <div class="foot-links">
      <a href="index.html">홈</a>
      <a href="community.html">커뮤니티</a>
      <a href="privacy.html">개인정보처리방침</a>
    </div>
    <p>© 2026 MindPick.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="js/signup.js"></script>

</html>
