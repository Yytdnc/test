<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>커플 비교 결과 | MindPick</title>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5113083554519679" crossorigin="anonymous"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html"><span class="logo-emoji">🧠</span>Mind<span class="accent">Pick</span></a>
    <nav>
      <a href="index.html">홈</a>
      <a href="community.html">커뮤니티</a>
      <a href="privacy.html">개인정보처리방침</a>
    </nav>
  </header>

  <main class="result-shell">
    <div id="compare-not-found" style="display:none; text-align:center; padding: 60px 0;">
      <p>비교할 결과를 찾을 수 없어요. 링크가 만료됐거나 잘못됐을 수 있어요.<br /><a href="index.html" style="color:var(--accent); font-weight:700;">홈으로 돌아가기</a></p>
    </div>

    <div id="compare-content">
      <div id="match-badge" class="match-badge"></div>

      <div class="compare-cards">
        <div class="result-card compare-card">
          <div class="whose">나</div>
          <div class="r-emoji" id="me-emoji"></div>
          <h2 id="me-title"></h2>
        </div>
        <div class="result-card compare-card">
          <div class="whose">상대방</div>
          <div class="r-emoji" id="partner-emoji"></div>
          <h2 id="partner-title"></h2>
        </div>
      </div>

      <section class="section">
        <div class="section-head">
          <h2>문항별 답변 비교</h2>
        </div>
        <div id="compare-list" class="compare-list"></div>
      </section>

      <div class="result-actions">
        <a class="button ghost" style="flex:1;" href="index.html">홈으로</a>
        <button type="button" id="compare-share-btn" class="button primary" style="flex:1;">이 비교 결과 공유하기</button>
      </div>
    </div>

    <div class="ad-slot"><span>광고 영역 (AdSense)</span></div>

    <p class="disclaimer">본 테스트 결과는 재미로 즐기는 콘텐츠이며 과학적·심리학적 근거가 없습니다.</p>
  </main>

  <footer>
    <div class="foot-links">
      <a href="index.html">홈</a>
      <a href="community.html">커뮤니티</a>
      <a href="privacy.html">개인정보처리방침</a>
    </div>
    <p>© 2026 MindPick.</p>
  </footer>

  <script src="js/tests-data.js"></script>
  <script src="js/custom-tests.js"></script>
  <script src="js/tests-registry.js"></script>
  <script src="js/compare-utils.js"></script>
  <script src="js/compare.js"></script>

</html>
