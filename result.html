<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>결과 | MindPick</title>
  <meta name="description" content="MindPick 심리테스트 결과를 확인하고 친구와 공유해보세요." />
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />

  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5113083554519679" crossorigin="anonymous"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html"><span class="logo-emoji">🧠</span>Mind<span class="accent">Pick</span></a>
    <nav>
      <a href="index.html">홈</a>
      <a href="community.html">커뮤니티</a>
      <a href="privacy.html">개인정보처리방침</a>
    </nav>
  </header>

  <main class="result-shell">
    <div id="result-not-found" style="display:none; text-align:center; padding: 60px 0;">
      <p>결과를 찾을 수 없어요. 테스트를 먼저 진행해주세요.<br /><a href="index.html" style="color:var(--accent); font-weight:700;">홈으로 돌아가기</a></p>
    </div>

    <div id="result-card" class="result-card">
      <div class="r-emoji"></div>
      <div class="r-eyebrow"></div>
      <h1></h1>
      <p></p>
    </div>

    <div class="result-actions">
      <a id="retry-link" class="button ghost" style="flex:1;" href="index.html">다시 하기</a>
      <button id="share-btn" class="button primary" style="flex:1;">결과 링크 공유하기</button>
    </div>

    <div class="result-actions">
      <button id="share-community-btn" class="button ghost block">💬 커뮤니티에 결과 공유하고 이야기 나누기</button>
    </div>

    <div id="compare-invite" class="compare-invite" style="display:none;">
      <h2>💑 커플/친구와 답변 비교하기</h2>
      <p>링크를 보내서 상대방도 이 테스트를 하면, 서로의 답변과 결과를 나란히 비교해볼 수 있어요.</p>
      <button type="button" id="invite-btn" class="button primary block">비교 링크 만들어서 공유하기</button>
      <div id="invite-status" class="status-msg"></div>
    </div>

    <section class="section">
      <div class="section-head">
        <h2>다른 심리테스트도 해보세요</h2>
      </div>
      <div class="test-grid" id="related-test-grid"></div>
    </section>

    <p class="disclaimer">본 테스트 결과는 재미로 즐기는 콘텐츠이며 과학적·심리학적 근거가 없습니다.</p>
  </main>

  <footer>
    <div class="foot-links">
      <a href="index.html">홈</a>
      <a href="community.html">커뮤니티</a>
      <a href="privacy.html">개인정보처리방침</a>
    </div>
    <p>© 2026 MindPick.</p>
  </footer>

  <script src="js/tests-data.js"></script>
  <script src="js/custom-tests.js"></script>
  <script src="js/tests-registry.js"></script>
  <script src="js/compare-utils.js"></script>
  <script src="js/result.js"></script>
</body>
</html>
