<header class="w-full sticky top-0 z-50 bg-surface shadow-sm flex items-center justify-between px-margin-mobile h-16">
  <a class="w-10 h-10 sm:w-12 sm:h-12 flex items-center justify-center rounded-full hover:bg-surface-container-low transition-colors active:scale-95 duration-100 text-primary flex-shrink-0" href="index.html">
    <span class="material-symbols-outlined">home</span>
  </a>
  <h1 class="font-headline-md text-lg sm:text-headline-md text-primary font-bold truncate px-xs">커뮤니티</h1>
  <div id="auth-area" class="flex items-center gap-xs flex-shrink-0"></div>
</header>

<main class="flex-grow flex flex-col pt-md max-w-3xl mx-auto w-full md:px-margin-mobile pb-32">

  <div id="config-warning" class="mx-margin-mobile mb-md p-md rounded-lg bg-error-container text-on-error-container text-body-sm" style="display:none;">
    아직 관리자가 커뮤니티 연결을 완료하지 않았어요. 잠시 후 다시 확인해주세요.
  </div>

  <section class="w-full overflow-x-auto no-scrollbar pl-margin-mobile md:pl-0 pb-md">
    <div id="category-pills" class="flex gap-sm w-max pr-margin-mobile">
      <button type="button" data-category="all" class="pill-btn px-md py-sm text-label-md rounded-full font-semibold">#전체</button>
      <button type="button" data-category="free" class="pill-btn px-md py-sm text-label-md rounded-full font-semibold">#자유</button>
      <button type="button" data-category="qna" class="pill-btn px-md py-sm text-label-md rounded-full font-semibold">#질문</button>
      <button type="button" data-category="share" class="pill-btn px-md py-sm text-label-md rounded-full font-semibold">#결과공유</button>
    </div>
  </section>

  <section id="post-list" class="flex flex-col gap-lg px-margin-mobile md:px-0"></section>

  <div id="post-empty" class="text-center text-on-surface-variant text-body-sm py-xl" style="display:none;">
    아직 등록된 글이 없어요. 첫 글을 남겨보세요!
  </div>
</main>

<!-- FAB -->
<button id="compose-fab" type="button" class="fixed bottom-lg right-margin-mobile md:right-lg w-14 h-14 bg-primary text-on-primary rounded-2xl flex items-center justify-center shadow-[0_8px_24px_rgba(0,88,190,0.3)] hover:bg-primary-container transition-colors active:scale-95 z-40">
  <span class="material-symbols-outlined text-[28px]">edit</span>
</button>

<!-- Compose Modal -->
<div id="compose-modal" class="fixed inset-0 z-[60] hidden">
  <div id="compose-backdrop" class="absolute inset-0 bg-black/40"></div>
  <div class="absolute bottom-0 left-0 right-0 md:inset-0 md:flex md:items-center md:justify-center">
    <div class="bg-surface-container-lowest rounded-t-xl md:rounded-xl w-full md:max-w-lg max-h-[85vh] overflow-y-auto p-lg">
      <div class="flex items-center justify-between mb-md">
        <h2 class="text-headline-sm font-headline-sm font-semibold">✏️ 새 글 쓰기</h2>
        <button type="button" id="compose-close-btn" class="w-9 h-9 flex items-center justify-center rounded-full hover:bg-surface-container-low">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>

      <div id="share-preview" class="mb-md p-sm rounded-lg bg-primary-container/10 text-primary text-body-sm" style="display:none;"></div>

      <label class="block text-label-md text-on-surface-variant mb-xs">카테고리</label>
      <select id="post-category" class="w-full mb-md px-md py-sm rounded-lg border border-outline-variant bg-white text-body-md">
        <option value="free">자유</option>
        <option value="qna">질문</option>
        <option value="share">결과공유</option>
      </select>

      <label class="block text-label-md text-on-surface-variant mb-xs">제목</label>
      <input id="post-title" maxlength="60" class="w-full mb-md px-md py-sm rounded-lg border border-outline-variant text-body-md focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary" />

      <label class="block text-label-md text-on-surface-variant mb-xs">내용</label>
      <textarea id="post-content" rows="5" maxlength="2000" class="w-full mb-md px-md py-sm rounded-lg border border-outline-variant text-body-md focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary"></textarea>

      <button type="button" id="post-submit-btn" class="w-full py-sm bg-primary text-on-primary rounded-full font-label-md text-label-md font-semibold">등록하기</button>
      <div id="post-status" class="text-body-sm mt-sm"></div>
    </div>
  </div>
</div>
