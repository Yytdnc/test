<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>커뮤니티 | MindPick</title>
  <meta name="description" content="MindPick 이용자들과 테스트 결과, 이야기를 자유롭게 나눠보세요." />
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html"><span class="logo-emoji">🧠</span>Mind<span class="accent">Pick</span></a>
    <nav>
      <a href="index.html">홈</a>
      <a class="active" href="community.html">커뮤니티</a>
      <a href="privacy.html">개인정보처리방침</a>
    </nav>
  </header>

  <main class="community-shell">
    <div class="section-head" style="margin-bottom:18px;">
      <h1 style="font-size:1.4rem; font-weight:800; margin:0;">💬 커뮤니티</h1>
    </div>

    <div id="config-warning" class="status-msg err" style="display:none;">
      아직 관리자가 커뮤니티 연결을 완료하지 않았어요. 잠시 후 다시 확인해주세요.
    </div>

    <section id="auth-box" class="panel auth-box" style="display:none;">
      <div id="auth-logged-out">
        <div class="auth-tabs">
          <button type="button" class="auth-tab-btn active" data-tab="login">로그인</button>
          <button type="button" class="auth-tab-btn" data-tab="signup">회원가입</button>
        </div>

        <div id="tab-login" class="auth-tab-panel">
          <div class="field"><label>이메일</label><input type="email" id="login-email" autocomplete="username" /></div>
          <div class="field"><label>비밀번호</label><input type="password" id="login-password" autocomplete="current-password" /></div>
          <div class="toolbar">
            <button type="button" id="login-submit-btn" class="button primary">로그인</button>
          </div>
        </div>

        <div id="tab-signup" class="auth-tab-panel" style="display:none;">
          <div class="field"><label>닉네임</label><input type="text" id="signup-nickname" maxlength="20" /></div>
          <div class="field"><label>이메일</label><input type="email" id="signup-email" autocomplete="username" /></div>
          <div class="field"><label>비밀번호 (6자 이상)</label><input type="password" id="signup-password" autocomplete="new-password" /></div>
          <div class="toolbar">
            <button type="button" id="signup-submit-btn" class="button primary">회원가입</button>
          </div>
        </div>

        <div class="oauth-row">
          <button type="button" id="google-login-btn" class="button ghost block">구글로 계속하기</button>
          <button type="button" id="kakao-login-btn" class="button ghost block">카카오로 계속하기</button>
        </div>

        <div id="auth-status" class="status-msg"></div>
      </div>

      <div id="auth-logged-in" style="display:none;">
        <p><strong id="auth-nickname"></strong>님, 환영해요!</p>
        <button type="button" id="logout-btn" class="button ghost">로그아웃</button>
      </div>
    </section>

    <section id="write-box" class="panel" style="display:none;">
      <h2 style="font-size:1rem; margin:0 0 12px;">✏️ 새 글 쓰기</h2>
      <div class="field"><label>제목</label><input type="text" id="post-title" maxlength="60" /></div>
      <div class="field"><label>내용</label><textarea id="post-content" rows="4" maxlength="2000"></textarea></div>
      <div class="toolbar">
        <button type="button" id="post-submit-btn" class="button primary">등록하기</button>
      </div>
      <div id="post-status" class="status-msg"></div>
    </section>

    <section class="section">
      <div id="post-list" class="post-list"></div>
      <div id="post-empty" class="status-msg info" style="display:none;">아직 등록된 글이 없어요. 첫 글을 남겨보세요!</div>
    </section>

    <div class="ad-slot"><span>광고 영역 (AdSense)</span></div>
  </main>

  <footer>
    <div class="foot-links">
      <a href="index.html">홈</a>
      <a href="community.html">커뮤니티</a>
      <a href="privacy.html">개인정보처리방침</a>
    </div>
    <p>© 2026 MindPick.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/community.js"></script>
</body>
</html>
