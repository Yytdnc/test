<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>로그인 | MindPick</title>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html"><span class="logo-emoji">🧠</span>Mind<span class="accent">Pick</span></a>
    <nav>
      <a href="index.html">홈</a>
      <a href="community.html">커뮤니티</a>
      <a href="privacy.html">개인정보처리방침</a>
    </nav>
  </header>

  <main class="auth-shell">
    <div id="config-warning" class="status-msg err" style="display:none;">
      아직 관리자가 커뮤니티 연결을 완료하지 않았어요. 잠시 후 다시 확인해주세요.
    </div>

    <div id="auth-card" class="auth-card">
      <div class="auth-card-head">
        <span class="auth-emoji">🔑</span>
        <h1>로그인</h1>
        <p>다시 만나서 반가워요!</p>
      </div>

      <div class="field"><label>이메일</label><input type="email" id="login-email" autocomplete="username" /></div>
      <div class="field"><label>비밀번호</label><input type="password" id="login-password" autocomplete="current-password" /></div>
      <button type="button" id="login-submit-btn" class="button primary block">로그인</button>

      <div id="login-status" class="status-msg"></div>

      <div class="auth-divider"><span>또는</span></div>

      <button type="button" id="google-login-btn" class="button oauth google block">
        <span class="oauth-icon">G</span> 구글로 계속하기
      </button>
      <button type="button" id="kakao-login-btn" class="button oauth kakao block">
        <span class="oauth-icon">💬</span> 카카오로 계속하기
      </button>

      <p class="auth-switch">계정이 없으신가요? <a href="signup.html">회원가입</a></p>
    </div>
  </main>

  <footer>
    <div class="foot-links">
      <a href="index.html">홈</a>
      <a href="community.html">커뮤니티</a>
      <a href="privacy.html">개인정보처리방침</a>
    </div>
    <p>© 2026 MindPick.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
