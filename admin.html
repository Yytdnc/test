<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>관리자 | MindPick</title>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html"><span class="logo-emoji">🧠</span>Mind<span class="accent">Pick</span></a>
    <nav>
      <a href="index.html">사이트로</a>
    </nav>
  </header>

  <main class="admin-shell">
    <section class="panel" id="login-panel">
      <h1>🔒 관리자 로그인</h1>
      <p class="hint">관리자만 접근할 수 있어요.</p>
      <div class="field"><label>아이디</label><input type="text" id="login-id" autocomplete="username" /></div>
      <div class="field"><label>비밀번호</label><input type="password" id="login-pw" autocomplete="current-password" /></div>
      <div class="toolbar">
        <button type="button" id="login-btn" class="button primary">로그인</button>
      </div>
      <div id="login-status" class="status-msg"></div>
    </section>

    <section class="panel" id="admin-panel" style="display:none;">
      <div class="row2" style="align-items:center;">
        <h1 style="margin:0;">🛠️ 관리자 페이지</h1>
        <div style="text-align:right;"><button type="button" id="logout-btn" class="button ghost">로그아웃</button></div>
      </div>
      <p class="hint">기능은 아직 준비 중이에요. 필요한 기능을 설명해주시면 추가할게요.</p>
    </section>
  </main>

  <script src="js/admin.js"></script>
</body>
</html>
